# Strøm Cinema MPV keyboard controls
# Mouse controls are handled by portable_config/scripts/strom-osc.lua.

SPACE script-message-to strom-osc toggle-play
LEFT  script-message-to strom-osc seek-back
RIGHT script-message-to strom-osc seek-forward
a     script-message-to strom-osc cycle-audio
s     script-message-to strom-osc cycle-subs
i     script-message-to strom-osc toggle-info
ESC   quit

# Convenient Windows mouse controls.
WHEEL_UP   add volume 5
WHEEL_DOWN add volume -5
MBTN_BACK  quit

