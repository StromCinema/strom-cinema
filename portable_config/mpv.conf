# Strøm Cinema portable MPV configuration
# This folder travels beside mpv.exe; no user-wide MPV settings are changed.

# Replace MPV's default controller with the bundled Strøm interface.
osc=no
osd-bar=no

# Player behaviour
fullscreen=yes
keep-open=no
save-position-on-quit=yes
cursor-autohide=1500
cursor-autohide-fs-only=no

# Match the Android player's seek intervals.
hr-seek=yes
hr-seek-framedrop=no

# Subtitle defaults matching the ExoPlayer style.
sub-font-size=40
sub-color="#FFFFFF"
sub-border-size=1.5
sub-shadow-offset=2
